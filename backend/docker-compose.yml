name: product-dashboard

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME:-dashboard}
      MYSQL_USER: ${DB_USER:-dashboard}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dashboard}
    ports:
      - "${DB_PORT:-3309}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
